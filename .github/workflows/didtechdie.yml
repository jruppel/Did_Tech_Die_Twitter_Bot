name: Did Tech Die

on:
  workflow_dispatch:

  repository_dispatch:
    types: [cron-job]

concurrency:
  group: did-tech-die
  cancel-in-progress: false

jobs:
  run-bot:
    name: "Run bot (${{ github.event_name == 'repository_dispatch' && 'cron-job.org' || 'Manual' }})"
    runs-on: ubuntu-latest

    env:
      DID_TECH_DIE_TESTING: "false"

    steps:
      - name: Identify trigger
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "TRIGGER_SOURCE=cron-job.org" >> "$GITHUB_ENV"
          else
            echo "TRIGGER_SOURCE=Manual" >> "$GITHUB_ENV"
          fi

      - name: Show trigger
        run: |
          echo "================================"
          echo "Did Tech Die trigger"
          echo "================================"
          echo "Source: $TRIGGER_SOURCE"
          echo "Event:  ${{ github.event_name }}"
          echo "Actor:  ${{ github.actor }}"
          echo "Run:    ${{ github.run_number }}"
          echo "================================"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

          X_CONSUMER_KEY: op://DidTechDie/X Consumer Key/credential
          X_CONSUMER_SECRET: op://DidTechDie/X Consumer Secret/credential
          X_ACCESS_TOKEN: op://DidTechDie/X Access Token/credential
          X_ACCESS_TOKEN_SECRET: op://DidTechDie/X Access Token Secret/credential
          X_BEARER_TOKEN: op://DidTechDie/X Bearer Token/credential
          NEON_DATABASE_URL: op://DidTechDie/DidTechDie - Neon Database/credential

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python src/tweets.py
